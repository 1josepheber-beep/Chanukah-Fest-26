<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chanukah Fest 2026 — Edit the site</title>

<script>
/* ===================================================================
   SETTINGS
   =================================================================== */
var CONFIG = {
  FILE_VERSION: "Editor v1",

  // The same Apps Script the forms and the draw screen use.
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzwDkEPx2ioKaDoiBkkZNm37rI4ox4MiVe8v3fk138SWPDx66XJy5BD4TErWS3eLhJ5/exec",

  // Deliberately empty. This page sits on a public address, so the key
  // is typed in once per computer and kept in that browser.
  KEY: "",

  SITE: "/Chanukah-Fest-26/"
};

/* Only these are offered. White, and the red pair that marks a bad form
   field, stay fixed — they are not brand choices and changing them only
   breaks legibility. */
var COLOURS = [
  ["gold",      "Main gold",          "#F0B429"],
  ["gold-dark", "Gold, pressed",      "#DDA31C"],
  ["gold-deep", "Gold text on pale",  "#8A6A1E"],
  ["navy",      "Dark sections",      "#0A1E38"],
  ["navy-2",    "Darkest bands",      "#06142A"],
  ["ink",       "Headings",           "#16202E"],
  ["page",      "Page background",    "#F4F6F9"],
  ["link",      "Links",              "#1B6FA8"],
  ["body-txt",  "Body text",          "#46566A"],
  ["muted",     "Quiet text",         "#6B7C90"],
  ["soft",      "Text on dark",       "#C9DAEC"],
  ["line",      "Borders",            "#DDE5EE"],
  ["line-2",    "Borders, alternate", "#E3E9F0"],
  ["mint",      "Confirmations",      "#3EE8B5"]
];
</script>

<style>
:root {
  --bg:      #0E1623;
  --panel:   #16202E;
  --panel-2: #1D2A3C;
  --edge:    #2A3A50;
  --text:    #E8EEF6;
  --dim:     #8EA1B8;
  --gold:    #F0B429;
  --mint:    #3EE8B5;
  --warn:    #E8734A;
  --sans: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 var(--sans);
  display: flex; flex-direction: column;
}

/* ---------------- the way in ---------------- */
.lock {
  position: fixed; inset: 0; z-index: 90;
  background: #0A1420;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
/* a class selector out-specifies the hidden attribute, so the overlay
   would stay on top and swallow every click after unlocking */
.lock[hidden] { display: none; }
.lock-box { width: min(100%, 400px); text-align: center; }
.lock-box h1 { font-size: 1.6rem; margin: 0 0 6px; }
.lock-box p { color: var(--dim); margin: 0 0 20px; font-size: .95rem; }
.lock-box input {
  width: 100%; padding: 13px 15px; font: 1rem var(--sans);
  background: #0E1A28; color: var(--text);
  border: 1px solid var(--edge); border-radius: 9px;
}
.lock-box button {
  width: 100%; margin-top: 10px; padding: 13px;
  font: 700 1rem var(--sans); cursor: pointer;
  background: var(--gold); color: #16202E; border: 0; border-radius: 9px;
}
.lock-msg { margin-top: 12px; min-height: 1.3em; color: var(--warn); font-size: .9rem; }

/* ---------------- frame ---------------- */
header {
  display: flex; align-items: center; gap: 14px;
  padding: 11px 16px; background: var(--panel);
  border-bottom: 1px solid var(--edge); flex: 0 0 auto;
}
header h1 { font-size: 1rem; margin: 0; font-weight: 800; letter-spacing: .01em; }
header .spacer { flex: 1; }
.pill {
  font-size: .78rem; color: var(--dim);
  background: var(--panel-2); border: 1px solid var(--edge);
  padding: 4px 10px; border-radius: 999px;
}
.pill.dirty { color: #16202E; background: var(--gold); border-color: var(--gold); font-weight: 700; }

button.go, button.ghost {
  font: 700 .9rem var(--sans); cursor: pointer;
  padding: 9px 18px; border-radius: 8px; border: 1px solid var(--edge);
  background: var(--panel-2); color: var(--text);
}
button.go { background: var(--mint); color: #0B1F18; border-color: var(--mint); }
button.go:disabled { opacity: .4; cursor: default; }
button.ghost:hover { background: var(--edge); }

main { flex: 1; display: grid; grid-template-columns: minmax(380px, 460px) 1fr; min-height: 0; }

/* ---------------- left: the fields ---------------- */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--edge); }
.tabs { display: flex; gap: 2px; padding: 10px 12px 0; background: var(--panel); flex-wrap: wrap; }
.tab {
  font: 700 .82rem var(--sans); cursor: pointer;
  padding: 8px 12px; border-radius: 8px 8px 0 0;
  border: 1px solid transparent; border-bottom: 0;
  background: transparent; color: var(--dim);
}
.tab.on { background: var(--bg); color: var(--text); border-color: var(--edge); }
.tab .n { opacity: .55; font-weight: 600; }

.search { padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--edge); }
.search button.only {
  width: 100%; margin-top: 7px; padding: 7px 10px;
  font: 600 .82rem var(--sans); cursor: pointer; text-align: left;
  background: var(--panel-2); color: var(--dim);
  border: 1px solid var(--edge); border-radius: 8px;
}
.search button.only.on { background: var(--gold); color: #16202E; border-color: var(--gold); }
.search input {
  width: 100%; padding: 9px 12px; font: .92rem var(--sans);
  background: #0E1A28; color: var(--text);
  border: 1px solid var(--edge); border-radius: 8px;
}
.fields { overflow-y: auto; padding: 8px 12px 40px; flex: 1; }

.sec { border: 1px solid var(--edge); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.sec-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; background: var(--panel); cursor: pointer;
}
.sec-head b { font-size: .88rem; flex: 1; }
.sec-head .n { font-size: .76rem; color: var(--dim); }
.sec-tools { display: flex; gap: 4px; }
.sec-tools button {
  font: 700 .74rem var(--sans); cursor: pointer; padding: 3px 7px;
  background: var(--panel-2); color: var(--dim);
  border: 1px solid var(--edge); border-radius: 6px;
}
.sec-tools button:hover { color: var(--text); }
.sec-tools button.off { background: var(--warn); color: #2A0F05; border-color: var(--warn); }
.sec-body { padding: 4px 12px 12px; display: none; }
.sec.open .sec-body { display: block; }
.sec.hiddenblk .sec-head b { text-decoration: line-through; opacity: .5; }

.f { padding: 9px 0; border-top: 1px solid rgba(42,58,80,.6); }
.f:first-child { border-top: 0; }
.f label { display: block; font-size: .74rem; color: var(--dim); margin-bottom: 4px; }
.f .row { display: flex; gap: 6px; align-items: flex-start; }
.f textarea, .f input[type="text"], .f input[type="url"] {
  flex: 1; width: 100%; padding: 8px 10px; font: .9rem var(--sans);
  background: #0E1A28; color: var(--text);
  border: 1px solid var(--edge); border-radius: 7px; resize: vertical;
}
.f textarea { min-height: 38px; }
.f.changed textarea, .f.changed input { border-color: var(--gold); }
.f .undo {
  font: .72rem var(--sans); cursor: pointer; padding: 6px 8px;
  background: transparent; color: var(--dim);
  border: 1px solid var(--edge); border-radius: 6px; visibility: hidden;
}
.f.changed .undo { visibility: visible; }
.f .kind { font-size: .68rem; color: var(--gold); margin-left: 6px; }

.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sw { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
      border: 1px solid var(--edge); border-radius: 8px; }
.sw input[type="color"] { width: 34px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
.sw span { font-size: .78rem; flex: 1; }
.sw .hex { font-size: .7rem; color: var(--dim); font-family: ui-monospace, monospace; }

/* ---------------- right: the preview ---------------- */
.preview { display: flex; flex-direction: column; min-height: 0; background: #0A1420; }
.preview-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--edge); background: var(--panel);
}
.preview-bar span { font-size: .78rem; color: var(--dim); flex: 1; }
.preview-bar button {
  font: 600 .78rem var(--sans); cursor: pointer; padding: 5px 11px;
  background: var(--panel-2); color: var(--dim);
  border: 1px solid var(--edge); border-radius: 7px;
}
.preview-bar button.on { color: var(--text); border-color: var(--gold); }
.frame-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 14px; }
iframe {
  width: 100%; height: 100%; border: 1px solid var(--edge);
  border-radius: 10px; background: #fff;
}
iframe.phone { width: 400px; flex: 0 0 400px; }

.msg { padding: 9px 16px; font-size: .85rem; min-height: 1.2em; background: var(--panel); border-top: 1px solid var(--edge); }
.msg.bad { color: var(--warn); }
.msg.good { color: var(--mint); }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .preview { display: none; }
}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <h1>Edit the site</h1>
    <p>Chanukah Fest 2026. Enter the access key.</p>
    <input type="password" id="lockKey" autocomplete="current-password" spellcheck="false" placeholder="Access key">
    <button id="lockBtn">Unlock</button>
    <div class="lock-msg" id="lockMsg"></div>
  </div>
</div>

<header>
  <h1>Chanukah Fest 2026</h1>
  <span class="pill" id="count">—</span>
  <span class="spacer"></span>
  <button class="ghost" id="check">Check connection</button>
  <button class="ghost" id="revertAll">Undo all changes</button>
  <button class="go" id="save" disabled>Save and publish</button>
</header>

<main>
  <div class="side">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <input type="search" id="find" placeholder="Search all 605 pieces of text…">
      <button class="only" id="onlyChanged">Show only what has been changed</button>
    </div>
    <div class="fields" id="fields"></div>
  </div>

  <div class="preview">
    <div class="preview-bar">
      <span id="previewOf">Preview</span>
      <button id="wide" class="on">Desktop</button>
      <button id="narrow">Phone</button>
      <button id="reload">Reload</button>
    </div>
    <div class="frame-wrap"><iframe id="frame" title="Preview"></iframe></div>
  </div>
</main>

<div class="msg" id="msg"></div>

<script>
/* ===================================================================
   STATE
   The schema says what exists and what it originally said. `edits`
   holds only what has been changed from that, which is also all that
   is ever written to the spreadsheet — so a page whose wording nobody
   has touched keeps using the wording baked into the HTML, and keeps
   working even if the spreadsheet is unreachable.
   =================================================================== */
var $ = function (id) { return document.getElementById(id); };

var SCHEMA = null;
var saved = { fields: {}, colours: {}, sections: {} };   // what is live now
var edits = { fields: {}, colours: {}, sections: {} };   // what has changed here
var page = "index";
var openSecs = {};

function merged() {
  var out = { ok: true, fields: {}, colours: {}, sections: {} };
  [saved, edits].forEach(function (src) {
    for (var k in src.fields) out.fields[k] = src.fields[k];
    for (var c in src.colours) out.colours[c] = src.colours[c];
    for (var p in src.sections) {
      out.sections[p] = out.sections[p] || {};
      for (var s in src.sections[p]) out.sections[p][s] = src.sections[p][s];
    }
  });
  return out;
}

function countEdits() {
  var n = Object.keys(edits.fields).length + Object.keys(edits.colours).length;
  for (var p in edits.sections) n += Object.keys(edits.sections[p]).length;
  return n;
}

function touched() {
  var n = countEdits();
  var pill = $("count");
  pill.textContent = n ? n + " unsaved change" + (n === 1 ? "" : "s") : "No changes";
  pill.className = "pill" + (n ? " dirty" : "");
  $("save").disabled = !n;
}

/* ===================================================================
   THE FIELD LIST
   =================================================================== */
function pageOf(id) {
  for (var i = 0; i < SCHEMA.pages.length; i++)
    if (SCHEMA.pages[i].id === id) return SCHEMA.pages[i];
  return SCHEMA.pages[0];
}

function drawTabs() {
  var box = $("tabs");
  box.innerHTML = "";
  SCHEMA.pages.forEach(function (p) {
    var b = document.createElement("button");
    b.className = "tab" + (p.id === page ? " on" : "");
    b.innerHTML = p.name + ' <span class="n">' + p.fields.length + "</span>";
    b.onclick = function () { page = p.id; drawTabs(); drawFields(); showPreview(); };
    box.appendChild(b);
  });
  var b = document.createElement("button");
  b.className = "tab" + (page === "~colours" ? " on" : "");
  b.innerHTML = 'Colours <span class="n">' + COLOURS.length + "</span>";
  b.onclick = function () { page = "~colours"; drawTabs(); drawFields(); };
  box.appendChild(b);
}

function secState(pid, sid) {
  var m = merged().sections[pid] || {};
  return m[sid] || {};
}

function setSec(pid, sid, patch) {
  edits.sections[pid] = edits.sections[pid] || {};
  var now = edits.sections[pid][sid] || {};
  var base = (saved.sections[pid] || {})[sid] || {};
  var next = {};
  for (var k in base) next[k] = base[k];
  for (var k2 in now) next[k2] = now[k2];
  for (var k3 in patch) next[k3] = patch[k3];
  edits.sections[pid][sid] = next;
  touched(); push();
}

function drawFields() {
  var box = $("fields");
  box.innerHTML = "";
  var q = $("find").value.trim().toLowerCase();

  if (page === "~colours") return drawColours(box);

  var p = pageOf(page);
  var bySec = {};
  p.fields.forEach(function (f) {
    // "only changed" is how you find a stray note typed into a field
    // months ago, which is otherwise one row among six hundred
    if (onlyChanged && String(cur(f)) === String(f.value)) return;
    (bySec[f.sec] = bySec[f.sec] || []).push(f);
  });

  var order = p.sections.map(function (s) { return s.id; });
  Object.keys(bySec).forEach(function (s) { if (order.indexOf(s) === -1) order.push(s); });

  order.forEach(function (sid, idx) {
    var list = (bySec[sid] || []).filter(function (f) {
      return !q || f.label.toLowerCase().indexOf(q) > -1 ||
             String(cur(f)).toLowerCase().indexOf(q) > -1;
    });
    if (!list.length) return;

    var st = secState(page, sid);
    var sec = document.createElement("div");
    sec.className = "sec" + (openSecs[page + sid] || q ? " open" : "") + (st.hidden ? " hiddenblk" : "");

    var head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = '<b>' + sid.replace(/-/g, " ") + '</b><span class="n">' + list.length + "</span>";
    head.onclick = function (e) {
      if (e.target.tagName === "BUTTON") return;
      openSecs[page + sid] = !openSecs[page + sid];
      drawFields();
    };

    var tools = document.createElement("div");
    tools.className = "sec-tools";
    tools.appendChild(mini(st.hidden ? "Show" : "Hide", st.hidden ? "off" : "", function () {
      setSec(page, sid, { hidden: !st.hidden }); drawFields();
    }));
    tools.appendChild(mini("↑", "", function () { move(page, order, sid, -1); }));
    tools.appendChild(mini("↓", "", function () { move(page, order, sid, 1); }));
    head.appendChild(tools);
    sec.appendChild(head);

    var body = document.createElement("div");
    body.className = "sec-body";
    list.forEach(function (f) { body.appendChild(fieldRow(f)); });
    sec.appendChild(body);
    box.appendChild(sec);
  });

  if (!box.children.length) {
    box.innerHTML = '<p style="color:var(--dim);padding:14px 2px">' +
      (onlyChanged ? "Nothing on this page has been changed."
                   : "Nothing matches \u201c" + esc(q) + "\u201d.") + "</p>";
  }

  if (onlyChanged) {
    var n = 0;
    SCHEMA.pages.forEach(function (pg) {
      pg.fields.forEach(function (f) { if (String(cur(f)) !== String(f.value)) n++; });
    });
    var head = document.createElement("p");
    head.style.cssText = "color:var(--gold);font-size:.8rem;margin:0 2px 10px";
    head.textContent = n + " field" + (n === 1 ? " has" : "s have") +
                       " been changed across the whole site.";
    box.insertBefore(head, box.firstChild);
  }
}

function mini(label, cls, fn) {
  var b = document.createElement("button");
  b.textContent = label; b.className = cls;
  b.onclick = function (e) { e.stopPropagation(); fn(); };
  return b;
}

function move(pid, order, sid, dir) {
  var now = order.slice();
  var i = now.indexOf(sid);
  var j = i + dir;
  if (i < 0 || j < 0 || j >= now.length) return;
  now.splice(j, 0, now.splice(i, 1)[0]);
  now.forEach(function (s, at) { setSec(pid, s, { at: at }); });
  drawFields();
}

function cur(f) {
  if (f.key in edits.fields) return edits.fields[f.key];
  if (f.key in saved.fields) return saved.fields[f.key];
  return f.value;
}

function fieldRow(f) {
  var wrap = document.createElement("div");
  var changed = (f.key in edits.fields) || (f.key in saved.fields && saved.fields[f.key] !== f.value);
  wrap.className = "f" + (changed ? " changed" : "");

  var lab = document.createElement("label");
  lab.textContent = f.label;
  if (f.type !== "text") {
    var k = document.createElement("span");
    k.className = "kind"; k.textContent = f.type;
    lab.appendChild(k);
  }
  wrap.appendChild(lab);

  var row = document.createElement("div");
  row.className = "row";

  var input;
  var value = String(cur(f));
  if (f.type === "link" || f.type === "image") {
    input = document.createElement("input");
    input.type = "text";
  } else {
    input = document.createElement("textarea");
    input.rows = value.length > 70 ? 3 : 1;
  }
  input.value = value;
  input.oninput = function () {
    if (input.value === f.value) delete edits.fields[f.key];
    else edits.fields[f.key] = input.value;
    wrap.className = "f" + (input.value === f.value ? "" : " changed");
    touched(); push();
  };
  row.appendChild(input);

  row.appendChild((function () {
    var u = document.createElement("button");
    u.className = "undo"; u.textContent = "Undo";
    u.onclick = function () {
      delete edits.fields[f.key];
      input.value = f.value;
      edits.fields[f.key] = f.value;    // explicitly return it to the original
      wrap.className = "f";
      touched(); push();
    };
    return u;
  })());

  wrap.appendChild(row);
  return wrap;
}

function drawColours(box) {
  var grid = document.createElement("div");
  grid.className = "swatches";
  COLOURS.forEach(function (c) {
    var name = c[0], label = c[1], dflt = c[2];
    var value = edits.colours[name] || saved.colours[name] || dflt;

    var sw = document.createElement("div");
    sw.className = "sw";
    var pick = document.createElement("input");
    pick.type = "color"; pick.value = value;
    var txt = document.createElement("span"); txt.textContent = label;
    var hex = document.createElement("span"); hex.className = "hex"; hex.textContent = value;
    pick.oninput = function () {
      hex.textContent = pick.value;
      if (pick.value.toUpperCase() === dflt.toUpperCase()) delete edits.colours[name];
      else edits.colours[name] = pick.value;
      touched(); push();
    };
    sw.appendChild(pick); sw.appendChild(txt); sw.appendChild(hex);
    grid.appendChild(sw);
  });
  box.appendChild(grid);

  var note = document.createElement("p");
  note.style.cssText = "color:var(--dim);font-size:.8rem;margin-top:14px";
  note.textContent = "Colours apply to every page at once. White and the red used to " +
                     "mark a missed form field are fixed, because changing those only " +
                     "makes the site harder to read.";
  box.appendChild(note);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ===================================================================
   PREVIEW
   =================================================================== */
var frameReady = false;

function showPreview() {
  var p = page === "~colours" ? "index" : page;
  var url = CONFIG.SITE + (p === "index" ? "" : p + "/");
  $("previewOf").textContent = "Preview — " + url;
  frameReady = false;
  $("frame").src = url;
}

function push() {
  if (!frameReady) return;
  try {
    $("frame").contentWindow.postMessage({ cf: "preview", data: merged() }, "*");
  } catch (e) {}
}

addEventListener("message", function (e) {
  if (e.data && e.data.cf === "ready") { frameReady = true; push(); }
});

/* ===================================================================
   TALKING TO THE SPREADSHEET
   =================================================================== */
function say(text, kind) {
  var m = $("msg");
  m.textContent = text;
  m.className = "msg" + (kind ? " " + kind : "");
}

function load(done) {
  fetch(CONFIG.ENDPOINT + "?action=content&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) return done(false);
      saved = { fields: d.fields || {}, colours: d.colours || {}, sections: d.sections || {} };
      done(true);
    })
    .catch(function () { done(false); });
}

$("save").onclick = function () {
  var n = countEdits();
  $("save").disabled = true;
  say("Saving " + n + " change" + (n === 1 ? "" : "s") + "…");

  var body = new URLSearchParams();
  body.set("action", "savecontent");
  body.set("key", CONFIG.KEY);
  body.set("payload", JSON.stringify(edits));

  fetch(CONFIG.ENDPOINT, { method: "POST", body: body })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) throw new Error(d && d.error || "refused");
      // fold what was just saved into what is live, and start clean
      for (var k in edits.fields) saved.fields[k] = edits.fields[k];
      for (var c in edits.colours) saved.colours[c] = edits.colours[c];
      for (var p in edits.sections) {
        saved.sections[p] = saved.sections[p] || {};
        for (var s in edits.sections[p]) saved.sections[p][s] = edits.sections[p][s];
      }
      edits = { fields: {}, colours: {}, sections: {} };
      touched(); drawFields();
      say("Saved. The site is updated — give it a few seconds, then reload the page to see it.", "good");
    })
    .catch(function (err) {
      $("save").disabled = false;
      say("Could not save: " + err.message + ". Nothing was changed on the site.", "bad");
    });
};

/* Says, in plain words, whether the site can actually read what has
   been saved — and clears this browser's copy, which is the one thing
   that can make a page keep showing wording that was changed days ago. */
$("check").onclick = function () {
  say("Checking\u2026");
  var url = CONFIG.ENDPOINT + "?action=content&t=" + Date.now();

  var report = function (how, d) {
    if (!d || !d.ok) {
      say("Reached Google (" + how + ") but it did not return saved content. " +
          "Check the deployment is set to Anyone.", "bad");
      return;
    }
    var nf = Object.keys(d.fields || {}).length;
    var nc = Object.keys(d.colours || {}).length;
    var ns = 0;
    for (var p in d.sections || {}) ns += Object.keys(d.sections[p]).length;
    var cached = "none";
    try {
      var raw = localStorage.getItem("cf26-content-v1");
      cached = raw ? Object.keys(JSON.parse(raw).fields || {}).length + " saved changes" : "none";
    } catch (e) {}
    say("Connected (" + how + "). The spreadsheet holds " + nf + " changed text" +
        (nf === 1 ? "" : "s") + ", " + nc + " colour" + (nc === 1 ? "" : "s") +
        " and " + ns + " block setting" + (ns === 1 ? "" : "s") +
        ". This browser's copy: " + cached + ".",
        nf + nc + ns ? "good" : "bad");
  };

  var answered = false;
  fetch(url).then(function (r) { return r.json(); })
    .then(function (d) { answered = true; report("direct", d); })
    .catch(function () {
      // the same second route the pages use
      var name = "cfCheck" + Math.floor(Math.random() * 1e9);
      var tag = document.createElement("script");
      window[name] = function (d) { answered = true; report("fallback", d); tag.remove(); };
      tag.src = url + "&callback=" + name;
      tag.onerror = function () {
        tag.remove();
        say("Could not reach the script at all. Check the address, and that the " +
            "deployment is set to Anyone.", "bad");
      };
      document.head.appendChild(tag);
    });
  setTimeout(function () {
    if (!answered) say("No answer from Google after 8 seconds.", "bad");
  }, 8000);
};

$("revertAll").onclick = function () {
  if (!countEdits()) return;
  if (!confirm("Undo every unsaved change on every page?")) return;
  edits = { fields: {}, colours: {}, sections: {} };
  touched(); drawFields(); showPreview();
  say("All unsaved changes undone.");
};

var onlyChanged = false;
$("onlyChanged").onclick = function () {
  onlyChanged = !onlyChanged;
  $("onlyChanged").className = "only" + (onlyChanged ? " on" : "");
  drawFields();
};

$("find").oninput = drawFields;
$("reload").onclick = showPreview;
$("wide").onclick = function () {
  $("frame").className = ""; $("wide").className = "on"; $("narrow").className = "";
};
$("narrow").onclick = function () {
  $("frame").className = "phone"; $("narrow").className = "on"; $("wide").className = "";
};

addEventListener("beforeunload", function (e) {
  if (countEdits()) { e.preventDefault(); e.returnValue = ""; }
});

/* ===================================================================
   THE WAY IN
   The key is checked by using it, exactly as on the draw screen: if
   the script accepts a save, it was right. There is nothing to verify
   locally, which is the point of keeping it out of this file.
   =================================================================== */
function start() {
  fetch(CONFIG.SITE + "assets/content-schema.json")
    .then(function (r) { return r.json(); })
    .then(function (s) {
      SCHEMA = s;
      var total = s.pages.reduce(function (a, p) { return a + p.fields.length; }, 0);
      $("find").placeholder = "Search all " + total + " pieces of text…";
      load(function (ok) {
        $("lock").hidden = true;
        drawTabs(); drawFields(); showPreview(); touched();
        say(ok ? "Ready." : "Could not read saved content — showing the wording built into the pages.",
            ok ? "" : "bad");
      });
    })
    .catch(function () {
      $("lockMsg").textContent = "Could not load the list of editable text.";
    });
}

$("lockBtn").onclick = function () {
  var k = $("lockKey").value.trim();
  if (!k) { $("lockMsg").textContent = "Enter the access key."; return; }
  CONFIG.KEY = k;
  try { localStorage.setItem("cf26-admin-key", k); } catch (e) {}
  start();
};
$("lockKey").addEventListener("keydown", function (e) {
  if (e.key === "Enter") $("lockBtn").click();
});

try {
  var k = localStorage.getItem("cf26-admin-key");
  if (k) { CONFIG.KEY = k; start(); }
} catch (e) {}
</script>

</body>
</html>
